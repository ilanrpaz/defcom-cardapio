<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>QR · Cardápio</title>
  <style>
    body { margin:0; min-height:100vh; display:grid; place-items:center; font-family:system-ui,sans-serif; background:#F2F5F3; color:#15201C; }
    .box { text-align:center; background:#fff; border:1px solid #D8E3DD; border-radius:18px; padding:28px 24px; max-width:360px; }
    h1 { margin:0 0 8px; font-size:20px; }
    p { margin:0 0 16px; color:#4D5C56; font-weight:600; font-size:14px; line-height:1.4; }
    img { width:240px; height:240px; border-radius:12px; background:#fff; }
    a { display:inline-block; margin-top:16px; color:#145C38; font-weight:800; word-break:break-all; font-size:13px; }
  </style>
</head>
<body>
  <div class="box">
    <h1>Cardápio essencial</h1>
    <p>Escaneie no celular — abre só o cardápio, sem o app.</p>
    <img src="./qr.png" alt="QR Code do cardápio" />
    <a href="https://ilanrpaz.github.io/defcom-cardapio/">https://ilanrpaz.github.io/defcom-cardapio/</a>
  </div>

</html>
