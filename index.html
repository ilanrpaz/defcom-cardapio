<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <title>Cardápio · Pedaço Paulista</title>
  <link rel="icon" href="./assets/logo-pedaco-circle.png" />
  <style>
    :root {
      --brand: #1B7A4A;
      --brand-deep: #145C38;
      --brand-soft: #E6F4EE;
      --ink: #15201C;
      --ink-soft: #4D5C56;
      --line: #D8E3DD;
      --surface: #FFFFFF;
      --bg: #F2F5F3;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      background: #dde5e1;
      color: var(--ink);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      -webkit-text-size-adjust: 100%;
    }
    /* Coluna estilo celular — evita “tudo zoado” no PC */
    .app {
      width: 100%;
      max-width: 430px;
      min-height: 100vh;
      margin: 0 auto;
      background: var(--bg);
      box-shadow: 0 0 40px rgba(0,0,0,.12);
      position: relative;
    }
    .top {
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px;
      padding-top: max(10px, env(safe-area-inset-top));
      background: var(--brand-deep);
      color: #fff;
    }
    .top img {
      width: 36px; height: 36px; border-radius: 50%;
      border: 1.5px solid #fff; object-fit: cover; background: #fff;
    }
    .top .grow { flex: 1; min-width: 0; }
    .top h1 { font-size: 15px; font-weight: 800; line-height: 1.2; }
    .top p { font-size: 11px; font-weight: 600; color: rgba(255,255,255,.75); margin-top: 1px; }
    .top button {
      border: 0; background: transparent; color: #fff;
      width: 36px; height: 36px; font-size: 18px; cursor: pointer;
    }
    .wrap { padding: 12px 16px 28px; padding-bottom: calc(28px + env(safe-area-inset-bottom)); }
    .search {
      display: flex; align-items: center; gap: 8px;
      background: #fff; border: 1px solid var(--line); border-radius: 999px;
      padding: 10px 14px; margin-bottom: 12px;
    }
    .search input {
      flex: 1; border: 0; outline: 0; background: transparent;
      font-size: 15px; font-weight: 600; color: var(--ink); min-width: 0;
    }
    .cats {
      display: flex; gap: 12px; overflow-x: auto; padding-bottom: 4px;
      margin-bottom: 12px; scrollbar-width: none; -webkit-overflow-scrolling: touch;
    }
    .cats::-webkit-scrollbar { display: none; }
    .cat {
      flex: 0 0 68px; border: 0; background: none; padding: 0; cursor: pointer; text-align: center;
    }
    .cat .circle {
      width: 60px; height: 60px; margin: 0 auto 5px; border-radius: 50%;
      background: var(--brand-soft); border: 2px solid transparent; overflow: hidden;
      display: flex; align-items: center; justify-content: center; font-size: 26px;
    }
    .cat.on .circle { border-color: var(--brand); }
    .cat img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .cat span {
      display: block; font-size: 11px; font-weight: 700; color: var(--ink-soft);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .cat.on span { color: var(--brand-deep); }
    .h2 { font-size: 17px; font-weight: 800; margin: 0 0 8px; text-align: left; }
    .hi-track {
      display: flex; gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory;
      scrollbar-width: none; -webkit-overflow-scrolling: touch; touch-action: pan-x;
    }
    .hi-track::-webkit-scrollbar { display: none; }
    .hi {
      flex: 0 0 100%; scroll-snap-align: start;
      background: #fff; border: 1px solid var(--line); border-radius: 16px;
      overflow: hidden; cursor: pointer;
    }
    .hi-img {
      width: 100%; height: 168px; background: #E8EEEA;
      display: flex; align-items: center; justify-content: center; font-size: 48px;
      overflow: hidden;
    }
    .hi-img img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .hi-txt { padding: 12px 14px; background: #fff; }
    .hi-txt strong { display: block; font-size: 17px; margin-bottom: 4px; }
    .hi-txt em {
      display: block; font-style: normal; font-size: 13px; color: var(--ink-soft);
      line-height: 1.35; margin-bottom: 6px; font-weight: 500;
    }
    .price { color: var(--brand-deep); font-weight: 800; font-size: 16px; }
    .dots { display: flex; justify-content: center; gap: 6px; margin: 8px 0 4px; }
    .dot {
      width: 7px; height: 7px; border-radius: 4px; border: 0; background: var(--line); cursor: pointer;
    }
    .dot.on { width: 16px; background: var(--brand); }
    .sec {
      margin-top: 10px;
      scroll-margin-top: 70px;
    }
    .sec-h {
      display: flex; align-items: center; gap: 8px;
      padding-top: 10px; margin-bottom: 8px; border-top: 1px solid var(--line);
      font-size: 17px; font-weight: 800;
    }
    .row {
      display: flex; gap: 10px; width: 100%;
      background: #fff; border: 1px solid var(--line); border-radius: 14px;
      padding: 10px; margin-bottom: 8px; cursor: pointer; text-align: left;
      color: inherit; font: inherit;
    }
    .thumb {
      width: 76px; height: 76px; border-radius: 12px; background: #E8EEEA;
      flex: 0 0 76px; overflow: hidden;
      display: flex; align-items: center; justify-content: center; font-size: 24px;
    }
    .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .row .body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; justify-content: center; }
    .row .body b { font-size: 15px; }
    .row .body small {
      font-size: 13px; color: var(--ink-soft); line-height: 1.3; font-weight: 500;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }
    .row .body .price { font-size: 15px; margin-top: 2px; }
    .empty { text-align: center; color: var(--ink-soft); font-weight: 600; padding: 40px 12px; }
    .modal {
      position: fixed; inset: 0; z-index: 40; display: none;
      align-items: flex-end; justify-content: center; background: rgba(0,0,0,.45);
    }
    .modal.on { display: flex; }
    .sheet {
      width: 100%; max-width: 430px; max-height: 88vh; overflow: auto;
      background: #fff; border-radius: 20px 20px 0 0;
      padding-bottom: env(safe-area-inset-bottom);
    }
    .sheet-img {
      height: 220px; background: #E8EEEA;
      display: flex; align-items: center; justify-content: center; font-size: 64px; overflow: hidden;
    }
    .sheet-img img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .sheet-pad { padding: 16px 18px 20px; }
    .sheet-pad h3 { font-size: 20px; font-weight: 800; margin-bottom: 6px; }
    .sheet-pad p { font-size: 14px; color: var(--ink-soft); line-height: 1.4; margin-bottom: 12px; font-weight: 500; }
    .sheet-pad .price { font-size: 20px; display: block; margin-bottom: 16px; }
    .sheet-pad button {
      width: 100%; border: 0; background: var(--brand); color: #fff;
      font-weight: 800; font-size: 15px; padding: 14px; border-radius: 14px; cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="top">
      <img src="./assets/logo-pedaco-circle.png" alt="" />
      <div class="grow">
        <h1 id="storeName">Pedaço Paulista</h1>
        <p>Cardápio online</p>
      </div>
      <button type="button" id="btnSearch" aria-label="Buscar">⌕</button>
    </header>

    <div class="wrap">
      <div class="search">
        <span aria-hidden="true">⌕</span>
        <input id="q" type="search" placeholder="Buscar pratos, bebidas..." autocomplete="off" />
      </div>
      <div id="root" class="empty">Carregando cardápio…</div>
    </div>
  </div>

  <div class="modal" id="modal">
    <div class="sheet" id="sheet"></div>
  </div>

  <script>
    const API = 'https://defcom-production.up.railway.app'
    const $ = (id) => document.getElementById(id)
    const money = (n) => Number(n || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' })
    const price = (i) => (i.promo && i.promoPrice != null ? i.promoPrice : i.price)
    const esc = (s) => String(s ?? '')
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')

    let cats = [], items = [], highlights = [], active = null, map = {}
    let hiI = 0, hiTimer = null, hiPause = false

    $('btnSearch').onclick = () => { $('q').focus() }
    $('q').oninput = () => draw()
    $('modal').onclick = (e) => { if (e.target === $('modal')) close() }

    function thumb(catId) {
      const x = items.find((i) => i.categoryId === catId && i.imageUrl)
      return x ? x.imageUrl : null
    }

    function sections() {
      const q = $('q').value.trim().toLowerCase()
      if (q) {
        return [{
          id: 'busca', name: 'Resultados', emoji: '🔎',
          items: items.filter((i) =>
            i.name.toLowerCase().includes(q) ||
            String(i.description || '').toLowerCase().includes(q)),
        }]
      }
      return cats
        .map((c) => ({ ...c, items: items.filter((i) => i.categoryId === c.id) }))
        .filter((s) => s.items.length)
    }

    function open(id) {
      const i = map[id]
      if (!i) return
      $('sheet').innerHTML =
        `<div class="sheet-img">${i.imageUrl ? `<img src="${esc(i.imageUrl)}" alt="">` : '🍽️'}</div>
         <div class="sheet-pad">
           <h3>${esc(i.name)}</h3>
           <p>${esc(i.description || 'Sem descrição cadastrada')}</p>
           <span class="price">${money(price(i))}</span>
           <button type="button" id="closeBtn">Fechar</button>
         </div>`
      $('modal').classList.add('on')
      $('closeBtn').onclick = close
    }
    function close() { $('modal').classList.remove('on'); $('sheet').innerHTML = '' }

    function goCat(id) {
      active = id
      $('q').value = ''
      draw()
      requestAnimationFrame(() => {
        const el = document.getElementById('sec-' + id)
        if (!el) return
        const top = document.querySelector('.top')
        const off = (top ? top.getBoundingClientRect().height : 56) + 8
        const y = el.getBoundingClientRect().top + window.scrollY - off
        window.scrollTo({ top: Math.max(0, y), behavior: 'smooth' })
      })
    }

    function goHi(n, anim) {
      const track = $('hiTrack')
      if (!track) return
      const cards = track.querySelectorAll('.hi')
      if (!cards.length) return
      hiI = ((n % cards.length) + cards.length) % cards.length
      track.scrollTo({ left: cards[hiI].offsetLeft, behavior: anim === false ? 'auto' : 'smooth' })
      document.querySelectorAll('#hiDots .dot').forEach((d, i) => d.classList.toggle('on', i === hiI))
    }

    function bindHi(n) {
      const track = $('hiTrack')
      if (!track) return
      if (hiTimer) clearInterval(hiTimer)
      let down = false, x0 = 0, left0 = 0, moved = false
      track.onpointerdown = (e) => {
        down = true; moved = false; hiPause = true
        x0 = e.clientX; left0 = track.scrollLeft
        track.setPointerCapture(e.pointerId)
      }
      track.onpointermove = (e) => {
        if (!down) return
        const dx = e.clientX - x0
        if (Math.abs(dx) > 6) moved = true
        track.scrollLeft = left0 - dx
      }
      const end = () => {
        if (!down) return
        down = false; hiPause = false
        track.dataset.moved = moved ? '1' : '0'
        const cards = [...track.querySelectorAll('.hi')]
        let best = 0, dist = Infinity
        cards.forEach((c, i) => {
          const d = Math.abs(c.offsetLeft - track.scrollLeft)
          if (d < dist) { dist = d; best = i }
        })
        goHi(best)
      }
      track.onpointerup = end
      track.onpointercancel = end
      track.onscroll = () => {
        const cards = [...track.querySelectorAll('.hi')]
        let best = 0, dist = Infinity
        cards.forEach((c, i) => {
          const d = Math.abs(c.offsetLeft - track.scrollLeft)
          if (d < dist) { dist = d; best = i }
        })
        if (best !== hiI) {
          hiI = best
          document.querySelectorAll('#hiDots .dot').forEach((d, i) => d.classList.toggle('on', i === hiI))
        }
      }
      document.querySelectorAll('#hiDots .dot').forEach((d) => {
        d.onclick = () => { hiPause = true; goHi(+d.dataset.i); setTimeout(() => hiPause = false, 400) }
      })
      if (n > 1) hiTimer = setInterval(() => { if (!hiPause) goHi(hiI + 1) }, 3800)
    }

    function draw() {
      const root = $('root')
      if (!items.length) {
        root.innerHTML = '<p class="empty">Nenhum item no cardápio ainda.</p>'
        return
      }
      const q = $('q').value.trim()
      const feat = highlights.length ? highlights : items.filter((i) => i.highlight).slice(0, 6)
      const secs = sections()
      let html = ''

      if (!q) {
        html += '<div class="cats">'
        cats.forEach((c) => {
          const t = thumb(c.id)
          html += `<button type="button" class="cat${c.id === active ? ' on' : ''}" data-cat="${esc(c.id)}">
            <div class="circle">${t ? `<img src="${esc(t)}" alt="">` : esc(c.emoji || '🍽️')}</div>
            <span>${esc(c.name)}</span>
          </button>`
        })
        html += '</div>'

        if (feat.length) {
          html += '<div class="h2">Destaques da casa</div><div class="hi-track" id="hiTrack">'
          feat.forEach((i) => {
            html += `<article class="hi" data-id="${esc(i.id)}">
              <div class="hi-img">${i.imageUrl ? `<img src="${esc(i.imageUrl)}" alt="">` : '🍽️'}</div>
              <div class="hi-txt">
                <strong>${esc(i.name)}</strong>
                ${i.description ? `<em>${esc(i.description)}</em>` : ''}
                <div class="price">${money(price(i))}</div>
              </div>
            </article>`
          })
          html += '</div>'
          if (feat.length > 1) {
            html += '<div class="dots" id="hiDots">'
            feat.forEach((_, i) => {
              html += `<button type="button" class="dot${i === 0 ? ' on' : ''}" data-i="${i}"></button>`
            })
            html += '</div>'
          }
        }
      }

      secs.forEach((s) => {
        html += `<section class="sec" id="sec-${esc(s.id)}">
          <div class="sec-h"><span>${esc(s.emoji || '🍽️')}</span>${esc(s.name)}</div>`
        s.items.forEach((i) => {
          html += `<button type="button" class="row" data-id="${esc(i.id)}">
            <div class="thumb">${i.imageUrl ? `<img src="${esc(i.imageUrl)}" alt="">` : esc(s.emoji || '🍽️')}</div>
            <div class="body">
              <b>${esc(i.name)}</b>
              <small>${esc(i.description || 'Sem descrição cadastrada')}</small>
              <div class="price">${money(price(i))}</div>
            </div>
          </button>`
        })
        html += '</section>'
      })

      root.innerHTML = html
      root.querySelectorAll('[data-cat]').forEach((b) => b.onclick = () => goCat(b.dataset.cat))
      root.querySelectorAll('[data-id]').forEach((b) => {
        b.onclick = () => {
          const track = $('hiTrack')
          if (track && b.classList.contains('hi') && track.dataset.moved === '1') {
            track.dataset.moved = '0'
            return
          }
          open(b.dataset.id)
        }
      })
      if (!q && feat.length) { hiI = 0; bindHi(feat.length) }
    }

    fetch(API + '/api/avod/public-menu')
      .then((r) => { if (!r.ok) throw new Error('fail'); return r.json() })
      .then((data) => {
        cats = data.categories || []
        items = (data.items || []).filter((i) => i.active !== false)
        items.forEach((i) => { map[i.id] = i })
        highlights = (data.highlights && data.highlights.length)
          ? data.highlights
          : items.filter((i) => i.highlight).slice(0, 6)
        highlights.forEach((i) => { map[i.id] = i })
        $('storeName').textContent = (data.company && data.company.nomeFantasia) || 'Pedaço Paulista'
        document.title = 'Cardápio · ' + $('storeName').textContent
        active = cats[0] ? cats[0].id : null
        draw()
      })
      .catch(() => {
        $('root').innerHTML = '<p class="empty">Não foi possível carregar o cardápio.</p>'
      })
  </script>
</body>
</html>
