<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <!-- defcom-cardapio-essencial -->
  <title>Cardápio · Pedaço Paulista</title>
  <link rel="icon" href="./assets/logo-pedaco-circle.png" />
  <style>
    :root {
      --brand: #1B7A4A;
      --brand-deep: #145C38;
      --brand-soft: #E6F4EE;
      --ink: #15201C;
      --ink-soft: #4D5C56;
      --line: #D8E3DD;
      --surface: #FFFFFF;
      --bg: #F2F5F3;
      --reservado: #E8A317;
      --reservado-soft: #FFE8B0;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    }
    .top {
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 14px;
      padding-top: max(12px, env(safe-area-inset-top));
      background: var(--brand-deep);
      color: #fff;
    }
    .top img {
      width: 36px;
      height: 36px;
      border-radius: 18px;
      object-fit: cover;
      border: 1.5px solid #fff;
      background: #fff;
    }
    .top h1 {
      margin: 0;
      font-size: 15px;
      font-weight: 800;
      line-height: 1.2;
    }
    .top p {
      margin: 1px 0 0;
      font-size: 11px;
      opacity: 0.75;
      font-weight: 600;
    }
    .top-grow { flex: 1; min-width: 0; }
    .search-btn {
      border: 0;
      background: transparent;
      color: #fff;
      width: 40px;
      height: 40px;
      border-radius: 12px;
      font-size: 18px;
      cursor: pointer;
    }
    main {
      max-width: 720px;
      margin: 0 auto;
      padding: 12px 16px calc(24px + env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .badge {
      align-self: flex-start;
      background: var(--reservado-soft);
      color: var(--reservado);
      font-size: 11px;
      font-weight: 800;
      padding: 5px 10px;
      border-radius: 999px;
    }
    .search {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 10px 14px;
    }
    .search.hidden { display: none; }
    .search input {
      flex: 1;
      border: 0;
      outline: none;
      font-size: 15px;
      font-weight: 600;
      color: var(--ink);
      background: transparent;
      min-width: 0;
    }
    .cats {
      display: flex;
      gap: 14px;
      overflow-x: auto;
      padding: 4px 0;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
    }
    .cats::-webkit-scrollbar { display: none; }
    .cat {
      flex: 0 0 auto;
      width: 72px;
      text-align: center;
      cursor: pointer;
      background: none;
      border: 0;
      padding: 0;
      color: inherit;
    }
    .cat-circle {
      width: 64px;
      height: 64px;
      margin: 0 auto 6px;
      border-radius: 32px;
      background: var(--brand-soft);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      border: 2px solid transparent;
      font-size: 28px;
    }
    .cat.on .cat-circle { border-color: var(--brand); }
    .cat img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .cat-label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      color: var(--ink-soft);
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .cat.on .cat-label { color: var(--brand-deep); }
    .section-title {
      margin: 0;
      font-size: 17px;
      font-weight: 800;
      color: var(--ink);
    }
    .hi-block { display: flex; flex-direction: column; gap: 10px; }
    .hi-wrap {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
      touch-action: pan-x;
      cursor: grab;
    }
    .hi-wrap.dragging { cursor: grabbing; }
    .hi-wrap::-webkit-scrollbar { display: none; }
    .hi {
      flex: 0 0 calc(100% - 4px);
      scroll-snap-align: start;
      background: var(--surface);
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid var(--line);
      display: flex;
      flex-direction: column;
    }
    .hi-media {
      width: 100%;
      height: 200px;
      background: #E8EEEA;
      overflow: hidden;
      flex: 0 0 200px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 48px;
      pointer-events: none;
    }
    .hi-media img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .hi-body {
      background: var(--surface);
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .hi-name {
      margin: 0;
      font-size: 18px;
      font-weight: 800;
      color: var(--ink);
    }
    .hi-desc {
      margin: 0;
      font-size: 13px;
      color: var(--ink-soft);
      line-height: 19px;
      font-weight: 500;
    }
    .hi-price {
      margin: 2px 0 0;
      font-size: 17px;
      font-weight: 800;
      color: var(--brand-deep);
    }
    .dots {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 6px;
      margin-top: 4px;
    }
    .dot {
      width: 7px;
      height: 7px;
      border-radius: 4px;
      border: 0;
      padding: 0;
      background: var(--line);
      cursor: pointer;
    }
    .dot.on {
      background: var(--brand);
      width: 16px;
    }
    .topic {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 4px;
    }
    .topic-head {
      display: flex;
      align-items: center;
      gap: 8px;
      padding-top: 6px;
      border-top: 1px solid var(--line);
    }
    .topic-head h2 {
      margin: 0;
      font-size: 18px;
      font-weight: 800;
      color: var(--ink);
    }
    .row {
      display: flex;
      gap: 12px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 12px;
    }
    .thumb {
      width: 84px;
      height: 84px;
      border-radius: 12px;
      background: #E8EEEA;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      flex: 0 0 84px;
      font-size: 26px;
    }
    .thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .row-body {
      min-width: 0;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 4px;
      justify-content: center;
    }
    .row-name {
      margin: 0;
      font-size: 15px;
      font-weight: 800;
      color: var(--ink);
    }
    .row-desc {
      margin: 0;
      font-size: 13px;
      color: var(--ink-soft);
      line-height: 18px;
      font-weight: 500;
    }
    .row-desc.muted { font-size: 12px; font-style: italic; }
    .row-price {
      margin: 2px 0 0;
      font-size: 15px;
      font-weight: 800;
      color: var(--brand-deep);
    }
    .empty, .loading {
      text-align: center;
      color: var(--ink-soft);
      font-weight: 600;
      padding: 40px 12px;
      line-height: 20px;
    }
  </style>
</head>
<body>
  <header class="top">
    <img src="./assets/logo-pedaco-circle.png" alt="Logo" />
    <div class="top-grow">
      <h1 id="storeName">Pedaço Paulista</h1>
      <p>Restaurante · cardápio essencial</p>
    </div>
    <button class="search-btn" id="toggleSearch" type="button" aria-label="Buscar">⌕</button>
  </header>

  <main>
    <div class="badge">CARDÁPIO ESSENCIAL</div>
    <div class="search" id="searchBox">
      <span aria-hidden="true">⌕</span>
      <input id="q" type="search" placeholder="Buscar pratos, bebidas..." autocomplete="off" />
    </div>
    <div id="content" class="loading">Carregando cardápio…</div>
  </main>

  <script>
    const money = (n) =>
      Number(n || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' })
    const priceOf = (item) =>
      item.promo && item.promoPrice != null ? item.promoPrice : item.price
    const esc = (s) =>
      String(s ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')

    const el = {
      content: document.getElementById('content'),
      storeName: document.getElementById('storeName'),
      searchBox: document.getElementById('searchBox'),
      q: document.getElementById('q'),
      toggleSearch: document.getElementById('toggleSearch'),
    }

    let categories = []
    let items = []
    let highlights = []
    let activeCatId = null
    let hiIndex = 0
    let hiTimer = null
    let hiPaused = false

    el.toggleSearch.addEventListener('click', () => {
      el.searchBox.classList.toggle('hidden')
      if (!el.searchBox.classList.contains('hidden')) el.q.focus()
    })
    el.q.addEventListener('input', () => render())

    function catThumb(catId) {
      const first = items.find((i) => i.categoryId === catId && i.imageUrl)
      return first?.imageUrl || null
    }

    function sections() {
      const q = el.q.value.trim().toLowerCase()
      if (q) {
        const matched = items.filter(
          (i) =>
            i.name.toLowerCase().includes(q) ||
            String(i.description || '').toLowerCase().includes(q),
        )
        return [{ id: 'busca', name: `Resultados · “${el.q.value.trim()}”`, emoji: '🔎', items: matched }]
      }
      return categories
        .map((c) => ({ ...c, items: items.filter((i) => i.categoryId === c.id) }))
        .filter((s) => s.items.length > 0)
    }

    function scrollToCat(id) {
      activeCatId = id
      el.q.value = ''
      render()
      requestAnimationFrame(() => {
        const node = document.getElementById('sec-' + id)
        if (node) node.scrollIntoView({ behavior: 'smooth', block: 'start' })
      })
    }

    function goHi(index, animated = true) {
      const wrap = document.getElementById('hiWrap')
      if (!wrap) return
      const cards = wrap.querySelectorAll('.hi')
      if (!cards.length) return
      const n = cards.length
      const next = ((index % n) + n) % n
      hiIndex = next
      const gap = 12
      const x = cards[next].offsetLeft
      wrap.scrollTo({ left: x, behavior: animated ? 'smooth' : 'auto' })
      wrap.querySelectorAll('.dot').forEach((d, i) => {
        d.classList.toggle('on', i === next)
      })
      // dots are outside wrap — update separately
      document.querySelectorAll('#hiDots .dot').forEach((d, i) => {
        d.classList.toggle('on', i === next)
      })
    }

    function bindHiCarousel(count) {
      const wrap = document.getElementById('hiWrap')
      const dots = document.getElementById('hiDots')
      if (!wrap) return

      if (hiTimer) {
        clearInterval(hiTimer)
        hiTimer = null
      }

      // drag com mouse (desktop) + touch nativo
      let down = false
      let startX = 0
      let startLeft = 0
      wrap.addEventListener('pointerdown', (e) => {
        down = true
        hiPaused = true
        startX = e.clientX
        startLeft = wrap.scrollLeft
        wrap.classList.add('dragging')
        wrap.setPointerCapture(e.pointerId)
      })
      wrap.addEventListener('pointermove', (e) => {
        if (!down) return
        wrap.scrollLeft = startLeft - (e.clientX - startX)
      })
      const endDrag = (e) => {
        if (!down) return
        down = false
        wrap.classList.remove('dragging')
        hiPaused = false
        // snap para o card mais próximo
        const cards = [...wrap.querySelectorAll('.hi')]
        if (!cards.length) return
        let best = 0
        let bestDist = Infinity
        cards.forEach((card, i) => {
          const dist = Math.abs(card.offsetLeft - wrap.scrollLeft)
          if (dist < bestDist) {
            bestDist = dist
            best = i
          }
        })
        goHi(best)
      }
      wrap.addEventListener('pointerup', endDrag)
      wrap.addEventListener('pointercancel', endDrag)

      wrap.addEventListener(
        'scroll',
        () => {
          const cards = [...wrap.querySelectorAll('.hi')]
          if (!cards.length) return
          let best = 0
          let bestDist = Infinity
          cards.forEach((card, i) => {
            const dist = Math.abs(card.offsetLeft - wrap.scrollLeft)
            if (dist < bestDist) {
              bestDist = dist
              best = i
            }
          })
          if (best !== hiIndex) {
            hiIndex = best
            document.querySelectorAll('#hiDots .dot').forEach((d, i) => {
              d.classList.toggle('on', i === best)
            })
          }
        },
        { passive: true },
      )

      if (dots) {
        dots.querySelectorAll('.dot').forEach((d) => {
          d.addEventListener('click', () => {
            hiPaused = true
            goHi(Number(d.getAttribute('data-i')))
            setTimeout(() => {
              hiPaused = false
            }, 500)
          })
        })
      }

      if (count > 1) {
        hiTimer = setInterval(() => {
          if (hiPaused) return
          goHi(hiIndex + 1)
        }, 3800)
      }
    }

    function render() {
      if (!items.length) {
        el.content.innerHTML =
          '<p class="empty">Nenhum item no cardápio ainda.</p>'
        return
      }

      const q = el.q.value.trim()
      const featured = highlights.length
        ? highlights
        : items.filter((i) => i.highlight).slice(0, 6)
      const secs = sections()
      let html = ''

      if (!q) {
        html += '<div class="cats">'
        for (const c of categories) {
          const on = c.id === activeCatId ? ' on' : ''
          const thumb = catThumb(c.id)
          html += `<button class="cat${on}" type="button" data-cat="${esc(c.id)}">
            <div class="cat-circle">${
              thumb
                ? `<img src="${esc(thumb)}" alt="" />`
                : esc(c.emoji || '🍽️')
            }</div>
            <span class="cat-label">${esc(c.name)}</span>
          </button>`
        }
        html += '</div>'

        if (featured.length) {
          html += '<div class="hi-block"><h2 class="section-title">Destaques da casa</h2>'
          html += '<div class="hi-wrap" id="hiWrap">'
          for (const item of featured) {
            html += `<article class="hi">
              <div class="hi-media">${
                item.imageUrl
                  ? `<img src="${esc(item.imageUrl)}" alt="" />`
                  : '🍽️'
              }</div>
              <div class="hi-body">
                <p class="hi-name">${esc(item.name)}</p>
                ${item.description ? `<p class="hi-desc">${esc(item.description)}</p>` : ''}
                <p class="hi-price">${money(priceOf(item))}</p>
              </div>
            </article>`
          }
          html += '</div>'
          if (featured.length > 1) {
            html += '<div class="dots" id="hiDots">'
            featured.forEach((_, i) => {
              html += `<button type="button" class="dot${i === 0 ? ' on' : ''}" data-i="${i}" aria-label="Destaque ${i + 1}"></button>`
            })
            html += '</div>'
          }
          html += '</div>'
        }
      }

      for (const sec of secs) {
        html += `<section class="topic" id="sec-${esc(sec.id)}">
          <div class="topic-head">
            <span>${esc(sec.emoji || '🍽️')}</span>
            <h2>${esc(sec.name)}</h2>
          </div>`
        for (const item of sec.items) {
          html += `<article class="row">
            <div class="thumb">${
              item.imageUrl
                ? `<img src="${esc(item.imageUrl)}" alt="" />`
                : esc(sec.emoji || '🍽️')
            }</div>
            <div class="row-body">
              <p class="row-name">${esc(item.name)}</p>
              <p class="row-desc ${item.description ? '' : 'muted'}">${
                esc(item.description || 'Sem descrição cadastrada')
              }</p>
              <p class="row-price">${money(priceOf(item))}</p>
            </div>
          </article>`
        }
        html += '</section>'
      }

      el.content.innerHTML = html
      el.content.querySelectorAll('[data-cat]').forEach((btn) => {
        btn.addEventListener('click', () => scrollToCat(btn.getAttribute('data-cat')))
      })

      if (!q && featured.length) {
        hiIndex = 0
        bindHiCarousel(featured.length)
      }
    }

    async function load() {
      try {
        const apiBase =
          location.protocol === 'file:' ||
          !/^https?:/i.test(location.protocol) ||
          location.origin.includes('github.io')
            ? 'https://defcom-production.up.railway.app'
            : location.origin
        const res = await fetch(`${apiBase}/api/avod/public-menu`)
        if (!res.ok) throw new Error('menu')
        const data = await res.json()
        categories = data.categories || []
        items = (data.items || []).filter((i) => i.active !== false)
        highlights = data.highlights?.length
          ? data.highlights
          : items.filter((i) => i.highlight).slice(0, 6)
        el.storeName.textContent =
          data.company?.nomeFantasia || 'Pedaço Paulista'
        activeCatId = categories[0]?.id || null
        document.title = `Cardápio · ${el.storeName.textContent}`
        render()
      } catch (e) {
        el.content.innerHTML =
          '<p class="empty">Não foi possível carregar o cardápio. Tente de novo em instantes.</p>'
      }
    }

    load()
  </script>
</body>
</html>
